# Model Configuration
model:
  name: "custom_tts"
  
  # Text Encoder
  text_encoder:
    vocab_size: 512
    embedding_dim: 512
    num_layers: 6
    num_heads: 8
    ff_dim: 2048
    dropout: 0.1
    max_seq_len: 500
    
  # Acoustic Decoder
  acoustic_decoder:
    in_features: 512
    out_features: 80  # Number of mel bins
    num_layers: 6
    num_heads: 8
    ff_dim: 2048
    dropout: 0.1
    
  # Duration Predictor
  duration_predictor:
    in_features: 512
    out_features: 1
    num_layers: 2
    kernel_size: 3
    dropout: 0.5
    
  # Pitch Predictor
  pitch_predictor:
    in_features: 512
    out_features: 1
    num_layers: 2
    kernel_size: 3
    dropout: 0.5
    
  # Energy Predictor
  energy_predictor:
    in_features: 512
    out_features: 1
    num_layers: 2
    kernel_size: 3
    dropout: 0.5

# Audio Processing
audio:
  sample_rate: 22050
  hop_length: 256
  win_length: 1024
  n_fft: 1024
  n_mels: 80
  fmin: 0
  fmax: 8000
  preemphasis: 0.97
  
# Training
training:
  batch_size: 32
  gradient_accumulation_steps: 1
  num_epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.0001
  warmup_steps: 4000
  lr_scheduler: "noam"
  clip_grad_norm: 1.0
  mixed_precision: true
  
# Optimization
optimizer:
  type: "adamw"
  betas: [0.9, 0.98]
  eps: 1e-9
  
# Data
data:
  train_split: 0.9
  val_split: 0.05
  test_split: 0.05
  min_audio_length: 0.5  # seconds
  max_audio_length: 15.0  # seconds
  normalize_audio: true
  
# Logging
logging:
  log_interval: 100
  save_interval: 1000
  tensorboard_dir: "logs/tensorboard"
  checkpoint_dir: "checkpoints"
  
# Device
device:
  cuda: true
  gpu_ids: [0]
  num_workers: 4
